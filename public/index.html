<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff5c9a">
<title>🦥 پلنر تنبل‌ها</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🦥</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
.stage{min-height:100vh;display:grid;place-items:center;padding:20px}
.mascot{font-size:64px;line-height:1.2;transition:transform .2s}
.mascot.bump{transform:rotate(-12deg) scale(1.2)}
.rules{margin:10px 0;text-align:right}
.rules li{font-size:14px;border:0;padding:3px 0}
.rules li.ok{color:#2a9d62}.rules li.no{color:var(--err);font-weight:600}
.meter{height:12px;border:2px solid var(--bd);border-radius:10px;overflow:hidden;margin:8px 0 2px}
.meter i{display:block;height:100%;width:0;background:var(--mint);transition:width .3s}
.shake{animation:sh .35s}@keyframes sh{25%{transform:translateX(8px)}75%{transform:translateX(-8px)}}
.fb{min-height:3em;font-size:14px;font-weight:600;margin:8px 0}
</style>
</head>
<body>
<main id="login" class="stage" hidden>
  <div class="box" id="lbox">
    <div class="mascot" id="mc">🦥</div>
    <h1>پلنر تنبل‌ها</h1>
    <p class="muted" id="slogan"></p>
    <label>نام کاربری<input id="lu" value="Admin" autocomplete="username"></label>
    <label>رمز عبور<input id="lp" type="password" autocomplete="current-password"></label>
    <p class="muted">اولین بار؟ هر دو فیلد را «Admin» بزن.</p>
    <p id="le" class="err"></p>
    <button class="primary" id="lb">ورود</button>
    <p><button class="link" id="fg">آلزایمر دارم</button></p>
  </div>
</main>

<main id="setup" class="stage" hidden>
  <div class="box" id="stA">
    <div class="mascot">🕵️</div>
    <h1>اسمت چیه؟</h1>
    <p class="muted">«Admin» برای آدم‌های بی‌هویته. یه اسم با شخصیت انتخاب کن.</p>
    <input id="nu" placeholder="مثلاً: صادق ایز د بست" maxlength="30" autocomplete="off">
    <p class="fb" id="nf"></p>
    <button class="primary" id="nb">بعدی</button>
  </div>
  <div class="box" id="stB" hidden>
    <div class="mascot">🐸</div>
    <h1>یه رمز بساز</h1>
    <p class="muted">کسی علاقه ای به دیدن پلن های تو نداره خودتو تذیت نکن</p>
    <input id="sp" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="رمزت رو بنویس…">
    <div class="meter"><i id="mt"></i></div>
    <div class="muted" id="ml"></div>
    <ul class="rules" id="rl"></ul>
    <p id="se" class="err"></p>
    <div class="opts" style="justify-content:center"><button class="primary" id="pb" disabled>ثبت رمز</button><button id="hb">تسلیمم 🏳️</button></div>
  </div>
  <div class="box" id="stC" hidden>
    <div class="mascot">🎉</div>
    <h1>تبریک!</h1>
    <p>حساب ساخته شد.خداشاهده استفاده نکنی ناراحت میشم.</p>
    <button class="primary" id="go">ورود به پلنر</button>
  </div>
</main>
<script src="home.js"></script>
</body>
</html>
